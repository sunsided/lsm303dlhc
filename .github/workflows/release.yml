---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATE: lsm303dlhc-ng

jobs:
  build:
    name: Build and attest the crate
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crate version $version"
            exit 1
          fi
      - name: Package crate
        run: |
          cargo package
          mkdir -p dist
          cp target/package/*.crate dist/
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.crate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs:
      - build
    runs-on: ubuntu-latest
    # The crates.io trusted publisher is bound to this environment.
    environment: crates-io
    permissions:
      contents: read # check out the repository
      id-token: write # exchange the OIDC token for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # A version that is already on crates.io (a manual release, or a re-run) is skipped.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sfA "sunsided/lsm303dlhc release workflow" \
              "https://crates.io/api/v1/crates/$CRATE/$version" > /dev/null; then
            echo "$CRATE $version is already on crates.io; skipping"
          else
            cargo publish
          fi

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          .github/scripts/release-notes.sh "$version" > release-notes.md
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file release-notes.md --verify-tag --repo "$GITHUB_REPOSITORY" dist/*
