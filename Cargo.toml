[package]
name = "lsm303dlhc-ng"
version = "0.3.4"
authors = ["Markus Mayer <widemeadows@gmail.com>", "Jorge Aparicio <jorge@japaric.io>"]
categories = ["embedded", "hardware-support", "no-std"]
description = "A platform agnostic driver to interface with the LSM303DLHC (accelerometer + compass)"
keywords = ["embedded-hal-driver", "accelerometer", "compass", "MEMS", "IMU"]
license = "EUPL-1.2 OR MIT OR Apache-2.0"
homepage = "https://github.com/sunsided/lsm303dlhc"
repository = "https://github.com/sunsided/lsm303dlhc"
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[features]
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt", "lsm303dlhc-registers/defmt"]

[lints.clippy]
# Modules live in `folder.rs` plus `folder/`, never in `folder/mod.rs`.
mod_module_files = "deny"

[dependencies]
defmt = { version = "1.0.1", optional = true }
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }
# shortcut: git-only until lsm303dlhc-registers 0.2.0 is on crates.io; `cargo publish` refuses it until then.
lsm303dlhc-registers = { git = "https://github.com/sunsided/lsm303dlhc-registers" }

[dev-dependencies]
embassy-futures = "0.1.2"
fake-bus = "0.1.0"

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/lsm303dlhc/releases/tag/v{{version}}", exactly = 1 },
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
